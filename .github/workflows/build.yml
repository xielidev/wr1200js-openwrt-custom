name: Build firmware

on:
  # Manual trigger from the Actions tab.
  workflow_dispatch:
  # Build and publish a release when a version tag (e.g. v25.12.5-r1) is pushed.
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ramips/mt7621 (youhua_wr1200js)
    runs-on: ubuntu-latest
    # A from-scratch OpenWrt build on a 2-core runner is slow; GitHub's hard
    # limit is 6h, so cap a little below it.
    timeout-minutes: 350

    env:
      # OpenWrt puts its ccache in $(TOPDIR)/.ccache and only reads CCACHE_DIR
      # from the environment for size/behaviour knobs, so set the size here.
      CCACHE_MAXSIZE: 2G

    steps:
      - name: Checkout this overlay repo
        uses: actions/checkout@v4

      # A full build needs ~25 GB; the runner only ships ~14 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pip rsync unzip zlib1g-dev file wget curl time

      - name: Clone OpenWrt at v25.12.5
        run: |
          git clone -b v25.12.5 --depth 1 \
            https://git.openwrt.org/openwrt/openwrt.git openwrt

      - name: Overlay custom files and packages
        run: |
          cp -a files openwrt/
          cp -a package/luci-app-socat package/luci-app-dynv6 openwrt/package/
          cp .config openwrt/.config

      # OpenWrt's ccache lives in $(TOPDIR)/.ccache. Restore it only after the
      # clone: git clone requires an empty target, and actions/cache creates the
      # path it restores. The post-step saves updates after the build.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('.config') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      # CONFIG_CCACHE only has a prompt when DEVEL is set, so defconfig would
      # otherwise drop it. DEVEL merely exposes extra developer options; it does
      # not change the resulting image on its own.
      - name: Enable ccache
        run: |
          cd openwrt
          sed -i 's/^# CONFIG_DEVEL is not set/CONFIG_DEVEL=y/' .config
          sed -i '/^CONFIG_CCACHE=/d; /^# CONFIG_CCACHE is not set/d' .config
          echo 'CONFIG_CCACHE=y' >> .config

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd openwrt
          git config --global user.name "OpenWrt Builder"
          git config --global user.email "builder@localhost"
          make defconfig
          grep -E '^CONFIG_(CCACHE|DEVEL)' .config

      - name: Download sources
        run: |
          cd openwrt
          make -j"$(nproc)" download

      - name: Build
        run: |
          cd openwrt
          make -j"$(nproc)"

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp openwrt/bin/targets/ramips/mt7621/*-squashfs-sysupgrade.bin out/
          cp openwrt/bin/targets/ramips/mt7621/*-initramfs-kernel.bin out/ || true
          cp openwrt/bin/targets/ramips/mt7621/sha256sums      out/sha256sums.txt || true
          ls -la out

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: wr1200js-firmware
          path: out/*
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "Automated firmware build for ${GITHUB_REF_NAME}." \
          || gh release upload "${GITHUB_REF_NAME}" out/* --clobber